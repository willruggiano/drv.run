<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151719">
  <title>No session</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="stacked-layout" data-view="conversation">
  <header id="app-header">
    <div class="bar">
      <h1><button id="title" type="button" data-view="sessions" title="Sessions">No session</button><span id="status" class="session-status" data-state="none" role="status" title="No session"><span class="sr-only">No session</span></span><span id="view-title" tabindex="-1" hidden></span></h1>
      <button id="close-view" class="icon" type="button" aria-label="Return to conversation" title="Return to conversation" data-view="conversation" hidden><svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <button id="menu-toggle" class="icon" type="button" aria-label="Global settings" title="Global settings" data-view="global"><svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 3-.6 2.4-1.5.9-2.4-.7-3 5.2L3.3 12l.1 1.8-1.7 1.8 3 5.2 2.3-.7 1.6.9.5 2.4h6l.6-2.4 1.5-.9 2.4.7 3-5.2-1.8-1.2-.1-1.8 1.7-1.8-3-5.2-2.3.7-1.6-.9L15 3Z" transform="translate(1 -1) scale(.92)"/><circle cx="12" cy="12" r="3.2"/></svg></button>
    </div>
    <div id="notice" role="status" hidden></div>
    <div id="recovery" hidden>Interrupted. A command may already have had side effects. <button id="resume" type="button">Resume</button></div>
    <div id="activity" role="status" hidden></div>
  </header>

  <main id="main-area">
    <div id="transcript" class="pane" aria-label="Conversation" tabindex="0"></div>
    <section id="picker" class="pane" aria-labelledby="view-title" hidden>
      <div id="sessions" aria-label="Sessions"></div><p id="sessions-empty" hidden>No sessions</p>
    </section>
    <section id="preferences" class="pane" aria-labelledby="view-title" hidden>
    <label><span>Session name</span><input id="session-name" maxlength="120" placeholder="Untitled session"></label>
    <label><span>Model</span><select id="session-model"></select></label>
    <label><span>Thinking</span><select id="thinking"></select></label>
    <label id="session-directory-field" hidden><span>Base directory</span><input id="session-directory" list="session-directories" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="/workspace (default)"></label>
    <datalist id="session-directories"></datalist>
    <label><span>Additional instructions</span><textarea id="instructions" rows="3" maxlength="100000"></textarea></label>
    <div class="actions"><button id="review-start" type="button" disabled>Review changes</button><button id="review-end" type="button" hidden>Finish review</button></div>
    </section>
    <section id="global-preferences" class="pane" aria-labelledby="view-title" hidden>
      <div id="global-settings-fields"><section id="model-defaults" class="settings-group"><h2>Model / thinking</h2>
        <label><span>Default model</span><select id="default-model"></select></label>
        <label><span>Thinking override for this model</span><select id="model-thinking-default"></select></label>
      </section></div>
      <label id="wrap-field"><span>Wrap code</span><select id="wrap-code"><option value="false">Off</option><option value="true">On</option></select></label>
      <section class="settings-group" id="app-settings" aria-label="App" hidden><button id="install" hidden>Install app</button></section>
    </section>
    <section id="usage-dialog" class="pane" aria-labelledby="view-title" hidden>
      <dl>
      <dt>Workspace</dt><dd id="usage-workspace"></dd>
      <dt>Repository</dt><dd id="usage-repository"></dd>
      <dt>Model</dt><dd id="usage-model"></dd>
      <dt>Thinking</dt><dd id="usage-thinking"></dd>
      <dt>Input tokens</dt><dd id="usage-input"></dd>
      <dt>Output tokens</dt><dd id="usage-output"></dd>
      <dt>Cache read</dt><dd id="usage-read"></dd>
      <dt>Cache write</dt><dd id="usage-write"></dd>
      <dt>Cache hit · last response</dt><dd id="usage-hit"></dd>
      <dt>Estimated cost · USD</dt><dd id="usage-cost"></dd>
      <dt>Context · last response</dt><dd id="usage-context"></dd>
      <dt>Context window</dt><dd id="usage-window"></dd>
      <dt>Auto compaction</dt><dd id="usage-auto"></dd>
      </dl>
    </section>
    <section id="branch-picker" class="pane" aria-labelledby="view-title" hidden>
      <div id="branches" aria-label="Branches"></div>
    </section>
    <section id="new-options" aria-label="New session options" hidden><div>

      <label><span>Environment</span><select id="targets" aria-label="Environment"></select></label>
      <label><span>Model</span><select id="models" aria-label="Model"></select></label>
    <label id="new-directory-field" hidden><span>Base directory</span><input id="new-directory" list="new-directories" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="/workspace (default)"></label>
    <datalist id="new-directories"></datalist>
    <label><span>Thinking level</span><select id="new-thinking"></select></label>
    </div></section>
    <div id="queue" aria-label="Queued messages" hidden></div>
  </main>
  <footer id="app-footer" class="composer-area">
    <button id="latest" hidden>↓ Latest</button>
    <form id="composer">
      <div class="compose-box">
        <div id="completions" role="listbox" aria-label="Message completions" hidden></div>
        <textarea id="prompt" aria-label="Message" rows="2" placeholder="Ask Pi…" maxlength="100000"></textarea>
        <div id="attachments" aria-label="Attached images"></div>
        <div class="actions"><button id="input-toggle" class="icon" type="button" popovertarget="input-menu" aria-label="Upload attachments">+</button><button id="input-mode" type="button" hidden>Follow up</button><span class="spacer"></span><button id="stop" class="icon" type="button" hidden disabled aria-label="Stop" title="Stop"><span aria-hidden="true">×</span></button><button id="send" class="icon" type="submit" disabled aria-label="Send" title="Send (Ctrl/⌘ Enter)"><span aria-hidden="true">↑</span></button></div>
      </div>
      <input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    </form>
    <div id="session-filter-bar" hidden><div class="compose-box">
        <textarea id="session-filter" aria-label="Filter sessions" rows="2" placeholder="Filter sessions…" autocomplete="off"></textarea>
        <div class="actions"><span class="spacer"></span><button id="new-options-toggle" class="icon" type="button" aria-label="New session options" title="New session options" aria-expanded="false" aria-controls="new-options"><svg class="glyph options-cog" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 3-.6 2.4-1.5.9-2.4-.7-3 5.2L3.3 12l.1 1.8-1.7 1.8 3 5.2 2.3-.7 1.6.9.5 2.4h6l.6-2.4 1.5-.9 2.4.7 3-5.2-1.8-1.2-.1-1.8 1.7-1.8-3-5.2-2.3.7-1.6-.9L15 3Z" transform="translate(1 -1) scale(.92)"/><circle cx="12" cy="12" r="3.2"/></svg><span class="options-close" aria-hidden="true">×</span></button><button id="create" disabled class="icon" type="button" aria-label="New session" title="New session">+</button></div>
      </div></div>
      <div id="search-bar" hidden><div class="compose-box">
        <textarea id="search" aria-label="Find in conversation" rows="2" placeholder="Find in conversation…" autocomplete="off"></textarea>
        <div class="actions"><span id="search-count" role="status"></span><span class="spacer"></span><button id="search-prev" class="icon" type="button" aria-label="Previous match" title="Previous match">↑</button><button id="search-next" class="icon" type="button" aria-label="Next match" title="Next match">↓</button></div>
      </div></div>
      <div id="bottom-line" aria-label="Conversation statistics" hidden>
      <div class="footer-row">
        <span id="footer-instance"></span>
        <button id="footer-stats" type="button" aria-label="Token and cost breakdown">
          <span id="footer-input"></span><span id="footer-output"></span><span id="footer-read" class="footer-cache"></span><span id="footer-hit" class="footer-cache"></span><span id="footer-cost"></span>
        </button>
        <button id="footer-model" type="button" aria-label="Model and thinking settings"><span id="footer-model-name"></span><span class="footer-dot" aria-hidden="true"></span><span id="footer-effort"></span></button>
        <span class="footer-dot" aria-hidden="true"></span>
        <button id="footer-context" type="button" aria-label="Context usage details"></button>
      </div>
    </div>
  </footer>
  <div id="tool-transcript" aria-label="Tool calls" tabindex="0"></div>
  <div id="input-menu" popover aria-label="Upload attachments"><button id="attach">Attach images</button></div>
  <div id="message-menu" popover="manual" aria-label="Message actions">
    <button id="copy-message" type="button" aria-label="Copy message" title="Copy message"><svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
    <button id="quote-message" type="button" aria-label="Quote in reply" title="Quote in reply"><svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 6h5v6H5zM14 6h5v6h-5zM10 12c0 4-2 6-5 6m14-6c0 4-2 6-5 6"/></svg></button>
    <button id="fork-message" type="button" aria-label="Fork from here" title="Fork from here"><svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10m12-10v2c0 4-12 2-12 6"/></svg></button>
  </div>
  <script type="module" src="/client.js"></script>
</body>
</html>
