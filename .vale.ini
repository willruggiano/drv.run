# Vale 3.25.1 from the project's pinned nixpkgs.
# Run: nix shell --inputs-from . nixpkgs#vale --command vale --no-global .
# Local rules need no `vale sync`. Findings require review, not automatic fixes.
# These heuristics do not establish ASD-STE100 vocabulary or grammar compliance.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Drv
# Treat repository wiki links as references, not prose or unlinked filenames.
TokenIgnores = (\[\[[^\]\n]+\]\])

# Dependencies, generated output, and repository metadata are not authored prose.
[{microvm.nix/**,**/node_modules/**,**/dist/**,**/generated/**,**/coverage/**,**/elm-stuff/**,.scratch/**,.direnv/**,result*/**,.git/**,.jj/**}]
BasedOnStyles =
